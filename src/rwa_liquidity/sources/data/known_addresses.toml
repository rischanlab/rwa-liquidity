# Addresses that need treatment beyond the zero-address rule, per asset.
#
# excluded_contracts: contracts that hold the token on behalf of many end
#   holders, such as pools, vaults, wrappers and bridges. They are left out of
#   the retained holder population. Full-supply metrics still divide by total
#   supply, and retained coverage is reported beside them
#   (docs/methodology.md, section 2.4). Each list applies only to its asset.
#
# issuer_addresses: addresses that belong to the asset's own issuer, either in
#   the issuer's published list of contracts or by the issuer's Etherscan
#   label. Transfers to or from them are issuer-linked rather than residual.
#   Transaction behaviour alone does not qualify an address.
#
# Etherscan labels and issuer documentation were checked between August and
# October 2026. An asset with empty lists was checked and nothing qualified.

schema_version = 1

[[asset]]
uid = "ethereum:0x7712c34205737192402172409a8f7ccef8aa2aec"  # BUIDL
excluded_contracts = []
issuer_addresses = []
notes = """
No pooling contract among the largest holders, and no issuer address that
Securitize documents or Etherscan labels. BUIDL moves across chains through
Wormhole; no bridge contract appears among the largest holders or the most
frequent senders to the zero address. Dividends are paid as newly minted
tokens, so creation includes distributions (docs/methodology.md, section 1.2).
"""

