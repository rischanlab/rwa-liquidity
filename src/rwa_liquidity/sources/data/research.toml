# Research registry: the assets of Mafrur (2026), minus the two gold tokens.
#
# Selected by hand to match the sample of Mafrur, R. (2026), "Tokenized but
# illiquid? Evidence from real-world asset markets", FinTech 5(3), 62. PAXG and
# XAUT are left out because their transfer history is past the keyless
# adapter's log ceiling; USDC (the paper's benchmark) is left out for the same
# reason, by a much wider margin.
#
# Use it with:
#
#     uv run rwa-liquidity paper --registry research.toml --out paper_research \
#         --first-month 2025-12 --last-month 2026-08 --head <block>
#
# The defillama_slug fields are only read by the `report` command's TVL source,
# never by `paper`. The slugs marked "unverified" below were not checked
# against api.llama.fi.

schema_version = 1

